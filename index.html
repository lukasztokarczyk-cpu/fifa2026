<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strzałka ⚽ FIFA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root {
  --green:#16a34a; --green-bg:#dcfce7;
  --amber:#d97706; --amber-bg:#fef3c7;
  --red:#dc2626;   --red-bg:#fee2e2;
  --blue:#2563eb;  --blue-bg:#dbeafe;
  --gray:#6b7280;  --gray-bg:#f3f4f6;
  --border:#e5e7eb; --text:#111827; --text2:#6b7280;
  --bg:#f9fafb; --card:#ffffff;
  --radius:10px;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
header{background:#15803d;color:#fff;padding:.9rem 1.25rem;display:flex;align-items:center;gap:10px;}
header .logo{font-size:21px;font-weight:600;letter-spacing:-.5px;}
header .sub{font-size:13px;opacity:.75;margin-left:auto;}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--card);overflow-x:auto;}
.tab-btn{padding:11px 16px;font-size:14px;font-family:var(--sans);font-weight:500;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:#15803d;border-bottom-color:#15803d;}
main{max-width:720px;margin:0 auto;padding:1.25rem;}
.section{display:none;}.section.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.card-title{font-size:15px;font-weight:600;margin-bottom:1rem;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:8px 10px;color:var(--text2);font-weight:500;font-size:13px;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);font-size:13px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500;}
.b-green{background:var(--green-bg);color:var(--green);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-gray{background:var(--gray-bg);color:var(--gray);}
.b-blue{background:var(--blue-bg);color:var(--blue);}
.pts{font-family:var(--mono);font-weight:600;font-size:16px;text-align:center;}
.pts.p3{color:var(--green);}.pts.p1{color:var(--amber);}.pts.p0{color:var(--text2);}
.match-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.match-row:last-child{border-bottom:none;}
.match-teams{flex:1;font-weight:500;}
.match-score{font-family:var(--mono);min-width:52px;text-align:center;font-size:14px;}
label.fl{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px;}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--sans);background:var(--card);color:var(--text);transition:border-color .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#15803d;box-shadow:0 0 0 3px rgba(21,128,61,.1);}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
button.btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);font-size:14px;font-family:var(--sans);font-weight:500;cursor:pointer;background:var(--card);color:var(--text);transition:background .15s;}
button.btn:hover{background:var(--gray-bg);}
button.btn.primary{background:#15803d;color:#fff;border-color:#15803d;}
button.btn.primary:hover{background:#166534;}
button.btn:disabled{opacity:.4;cursor:not-allowed;}
.row{display:flex;gap:8px;align-items:flex-end;}.row>*{flex:1;}.row>button{flex:0 0 auto;}
.info{background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem;}
.warn{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:1rem;}
.ok{color:var(--green);font-size:13px;margin-top:6px;}
.err{color:var(--red);font-size:13px;margin-top:6px;}
.loading{color:var(--text2);font-size:14px;padding:.75rem 0;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
/* config overlay */
#cfg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem;}
#cfg-box{background:var(--card);border-radius:var(--radius);padding:1.5rem;max-width:400px;width:100%;}
#cfg-box h2{font-size:18px;font-weight:600;margin-bottom:.4rem;}
#cfg-box p{font-size:13px;color:var(--text2);margin-bottom:1rem;}
.cfg-field{margin-bottom:10px;}
</style>
</head>
<body>

<div id="cfg-overlay">
  <div id="cfg-box">
    <h2>⚽ Strzałka FIFA 2026</h2>
    <p>Pierwsze uruchomienie – ustaw hasło administratora.</p>
    <div class="cfg-field">
      <label class="fl">Hasło administratora</label>
      <input type="text" id="cfg-pass" placeholder="np. waldek123" maxlength="30" />
    </div>
    <button class="btn primary" onclick="saveConfig()" style="width:100%;margin-top:8px">Uruchom aplikację</button>
    <p id="cfg-msg" class="err"></p>
  </div>
</div>

<header>
  <span>⚽</span>
  <span class="logo">Strzałka FIFA 2026</span>
  <span class="sub" id="hdr-sub"></span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('ranking')">🏆 Tabela</button>
  <button class="tab-btn" onclick="showTab('mecze')">⚽ Mecze</button>
  <button class="tab-btn" onclick="showTab('typy')">📋 Moje typy</button>
  <button class="tab-btn" onclick="showTab('puchar')">🏆 Faza pucharna</button>
  <button class="tab-btn" onclick="showTab('regulamin')">📜 Regulamin</button>
  <button class="tab-btn" onclick="showTab('admin')">🔧 Admin</button>
</div>

<main>

<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;padding:1rem;overflow-y:auto" onclick="if(event.target===this)closeModal()">
  <div style="background:var(--card);border-radius:var(--radius);max-width:600px;margin:2rem auto;padding:1.25rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <div class="card-title" id="modal-title" style="margin-bottom:0">Typy</div>
      <button class="btn" style="padding:4px 12px" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="tab-ranking" class="section active">
  <div class="card">
    <div class="card-title">Ranking uczestników <span style="font-size:13px;font-weight:400;color:var(--text2)">(kliknij uczestnika, aby zobaczyć typy)</span></div>
    <div id="ranking-body"><div class="loading"><span class="spinner"></span>Ładowanie...</div></div>
  </div>
</div>

<div id="tab-mecze" class="section">
  <div class="info">Wyniki wpisuje administrator. Brak możliwości ręcznej edycji wyników.</div>
  <div class="card">
    <div id="mecze-body"><div class="loading"><span class="spinner"></span>Ładowanie...</div></div>
  </div>
</div>

<div id="tab-typy" class="section">
  <div class="card" id="typy-login-card">
    <div class="card-title">Moje typy</div>
    <div style="margin-bottom:10px">
      <label class="fl">Twoje imię / nick</label>
      <input type="text" id="typ-nick" placeholder="np. Waldek" maxlength="30" style="margin-bottom:8px" />
      <label class="fl">Hasło</label>
      <input type="password" id="typ-haslo" placeholder="hasło od administratora" maxlength="30" />
    </div>
    <button class="btn primary" onclick="zalogujTypera()" style
