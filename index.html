<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mundial 2026 Typer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f5;--surface:#fff;--border:#e2e2e2;--border2:#bbb;
  --text:#1a1a1a;--text2:#555;--text3:#888;
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --purple:#3C3489;--purple-l:#EEEDFE;
  --green:#27500A;--green-l:#EAF3DE;
  --amber:#633806;--amber-l:#FAEEDA;
  --red:#791F1F;--red-l:#FCEBEB;
  --gray:#444441;--gray-l:#F1EFE8;
  --r:10px;--rs:7px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.app{max-width:680px;margin:0 auto;padding:14px}

.header{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 17px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.h-left{display:flex;align-items:center;gap:10px}
.h-left h1{font-size:17px;font-weight:700;line-height:1.2}
.h-left small{font-size:12px;color:var(--text3)}
.h-right{display:flex;align-items:center;gap:7px;flex-shrink:0}

.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.ba{background:var(--purple-l);color:var(--purple)}
.bu{background:var(--green-l);color:var(--green)}
.bf{background:var(--amber-l);color:var(--amber)}
.bs{background:var(--purple-l);color:var(--purple)}
.bt{background:var(--green-l);color:var(--green)}
.bst{background:var(--gray-l);color:var(--gray)}
.bo{background:var(--green-l);color:var(--green)}
.bpts{background:var(--blue);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:700}

.btn{padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:5px;transition:background .12s}
.btn:hover{background:var(--bg)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.bp{background:var(--blue);color:#fff;border-color:var(--blue)}.bp:hover{background:var(--blue-d)}
.bd{background:var(--red);color:#fff;border-color:var(--red)}.bd:hover{background:#501313}
.bsm{padding:5px 11px;font-size:12px}.bxs{padding:3px 8px;font-size:11px}

.tabs{display:flex;gap:5px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--text2)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab:hover:not(.on){background:var(--bg)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;margin-bottom:11px}
.card h2{font-size:15px;font-weight:700;margin-bottom:12px}

.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.fg{margin-bottom:9px}
.fg label{display:block;font-size:12px;color:var(--text2);font-weight:500;margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--rs);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,.13)}
.si{width:52px!important;text-align:center;font-size:16px;font-weight:700}

.al{padding:9px 13px;border-radius:var(--rs);font-size:13px;margin-bottom:9px;display:flex;align-items:flex-start;gap:7px}
.ai{background:var(--blue-l);color:var(--blue-d);border:1px solid #B5D4F4}
.aw{background:var(--amber-l);color:var(--amber);border:1px solid #FAC775}
.ae{background:var(--red-l);color:var(--red);border:1px solid #F7C1C1}
.as{background:var(--green-l);color:var(--green);border:1px solid #C0DD97}

.mi{border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px}
.mi:hover{border-color:var(--border2)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px;gap:8px}
.mt{font-size:14px;font-weight:700}
.mvs{color:var(--text3);font-weight:400;margin:0 5px}
.mm{font-size:12px;color:var(--text3);margin-bottom:7px}
.mtags{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.sr{display:flex;align-items:center;gap:7px;margin-top:9px}
.ss{font-size:18px;font-weight:700;color:var(--text3)}
.ar{margin-top:9px}
.ar label{font-size:12px;color:var(--text2);font-weight:500;display:block;margin-bottom:5px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border2);cursor:pointer;font-size:13px;background:var(--bg);color:var(--text2);transition:all .12s}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.bb{background:var(--bg);border-radius:var(--rs);padding:7px 11px;font-size:13px;margin-top:7px}
.bb strong{color:var(--blue)}
.ot{width:100%;border-collapse:collapse;font-size:13px;margin-top:7px}
.ot th{text-align:left;padding:4px 6px;color:var(--text3);font-weight:500;border-bottom:1px solid var(--border)}
.ot td{padding:5px 6px;border-bottom:1px solid var(--border)}
.ot tr:last-child td{border-bottom:none}
.sep{height:1px;background:var(--border);margin:10px 0}
.ol{font-size:12px;color:var(--text3);margin-bottom:3px}
.ln{font-size:12px;color:var(--text3);margin-top:5px;display:flex;align-items:center;gap:4px}
.rs{font-size:15px;font-weight:700;color:var(--blue);margin-top:5px}
.pl{font-size:13px;margin-top:3px;color:var(--text2)}

.lr{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--border)}
.lr:last-child{border-bottom:none}
.lp{font-size:14px;font-weight:700;width:22px;text-align:center}
.p1{color:#BA7517}.p2{color:#888780}.p3{color:#639922}
.la{width:33px;height:33px;border-radius:50%;background:var(--purple-l);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--purple);flex-shrink:0}
.ln2{flex:1;font-size:14px;font-weight:500}
.le{font-size:12px;color:var(--text3)}
.me{background:var(--blue-l);border-radius:var(--rs);margin:-2px -4px;padding:2px 4px}

.lw{max-width:380px;margin:50px auto 0}
.ll{text-align:center;font-size:38px;margin-bottom:6px}
.lt{text-align:center;font-size:19px;font-weight:700;margin-bottom:3px}
.ls{text-align:center;font-size:13px;color:var(--text3);margin-bottom:18px}

.ri{display:flex;gap:11px;align-items:flex-start;margin-bottom:15px}
.ric{width:37px;height:37px;border-radius:var(--rs);background:var(--purple-l);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ric i{font-size:18px;color:var(--purple)}
.rit{font-size:14px;font-weight:700;margin-bottom:2px}
.rix{font-size:13px;color:var(--text2);line-height:1.6}

.ur{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)}
.ur:last-child{border-bottom:none}
.ui{display:flex;align-items:center;gap:9px}
.empty{text-align:center;padding:26px 0;color:var(--text3);font-size:14px}
.sp{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* config notice */
.cfg-banner{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--r);padding:14px 17px;margin-bottom:13px;font-size:13px}
.cfg-banner strong{display:block;font-size:14px;margin-bottom:4px}
.cfg-banner code{background:#f8f8f8;border:1px solid #ddd;border-radius:4px;padding:2px 6px;font-size:12px}

@media(max-width:480px){
  .fr{grid-template-columns:1fr}
  .header{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
<div id="root"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  KONFIGURACJA — wklej URL swojego Google Apps Script Web App
// ══════════════════════════════════════════════════════════════
const SCRIPT_URL = "WKLEJ_URL_GAS_TUTAJ";
// Przykład: "https://script.google.com/macros/s/AKfy.../exec"
// ══════════════════════════════════════════════════════════════

let cbIndex = 0;
function api(action, data = {}) {
  return new Promise((resolve, reject) => {
    if (!SCRIPT_URL || SCRIPT_URL === "WKLEJ_URL_GAS_TUTAJ") {
      reject(new Error("Nie skonfigurowano SCRIPT_URL w pliku index.html")); return;
    }
    const cbName = "_gcb" + (++cbIndex);
    const timer = setTimeout(() => {
      delete window[cbName];
      reject(new Error("Timeout — sprawdź URL GAS"));
    }, 15000);
    window[cbName] = function(result) {
      clearTimeout(timer);
      delete window[cbName];
      const s = document.getElementById("_jsonp_" + cbIndex);
      if (s) s.remove();
      resolve(result);
    };
    const params = new URLSearchParams({ action, data: JSON.stringify(data), callback: cbName });
    const script = document.createElement("script");
    script.id = "_jsonp_" + cbIndex;
    script.src = SCRIPT_URL + "?" + params.toString();
    script.onerror = () => {
      clearTimeout(timer); delete window[cbName]; script.remove();
      reject(new Error("Błąd ładowania — sprawdź URL GAS"));
    };
    document.head.appendChild(script);
  });
}

// ── State ─────────────────────────────────────────────────────
// Predefiniowane ćwierćfinały — daty jako ISO (UTC+2 = CEST)
const QF_MATCHES = [
  { qfId:"qf1", home:"Francja",   away:"Maroko",     datetime:"2026-07-09T20:00:00", label:"Para 1" },
  { qfId:"qf2", home:"Hiszpania", away:"Belgia",      datetime:"2026-07-10T19:00:00", label:"Para 2" },
  { qfId:"qf3", home:"Norwegia",  away:"Anglia",      datetime:"2026-07-11T21:00:00", label:"Para 3" },
  { qfId:"qf4", home:"Argentyna", away:"Szwajcaria",  datetime:"2026-07-12T01:00:00", label:"Para 4" },
];

let S = {
  session: null,
  matches: [], bets: {}, leaderboard: [], users: [],
  tab: "qf", localAdv: {}
};

function matchStarted(m) {
  return m.datetime ? new Date(m.datetime).getTime() <= Date.now() : false;
}

function calcPts(bet, match) {
  if (!match.result) return null;
  const { home: rh, away: ra } = match.result;
  const bh = Number(bet.home), ba = Number(bet.away);
  const isFin = match.type === "final" || match.type === "third";
  const exact = bh === rh && ba === ra;
  const isR = rh === ra;
  let p = 0;
  if (exact) {
    p = isFin ? 5 : 3;
    if (isR && bet.advance === match.result.advance) p++;
  } else {
    const w = rh>ra?"home":ra>rh?"away":"draw";
    const bw = bh>ba?"home":ba>bh?"away":"draw";
    if (w === bw) { p = isFin ? 2 : 1; if (isR && bet.advance===match.result.advance) p++; }
  }
  return p;
}

function formatDate(dt) {
  if (!dt) return "";
  return new Date(dt).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

function showErr(el, msg) {
  el.style.display = ""; el.innerHTML = `<i class="ti ti-alert-circle"></i> ${msg}`;
}

// ── Render ────────────────────────────────────────────────────
function render() {
  const root = document.getElementById("root");
  const configured = SCRIPT_URL && SCRIPT_URL !== "WKLEJ_URL_GAS_TUTAJ";
  const cfgBanner = configured ? "" : `<div class="cfg-banner">
    <strong>⚠️ Konfiguracja wymagana</strong>
    Otwórz plik <code>index.html</code> i wpisz URL swojego GAS Web App w zmiennej <code>SCRIPT_URL</code> (linia ~30).
  </div>`;
  if (!S.session) { root.innerHTML = cfgBanner + renderLogin(); bindLogin(); return; }
  if (S.session.isAdmin) { root.innerHTML = cfgBanner + renderAdmin(); bindAdmin(); return; }
  root.innerHTML = cfgBanner + renderUser(); bindUser();
}

// ══════════════════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════════════════
function renderLogin() {
  return `<div class="lw">
    <div class="ll">⚽</div>
    <div class="lt">Mundial 2026 Typer</div>
    <div class="ls">Zaloguj się, aby typować wyniki</div>
    <div class="card">
      <div class="fg"><label>Nick</label><input id="li-n" placeholder="np. Marek" autocomplete="username"/></div>
      <div class="fg"><label>Hasło</label><input id="li-p" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
      <div id="li-e" class="al ae" style="display:none"></div>
      <button class="btn bp" id="li-btn" style="width:100%"><i class="ti ti-login"></i> Zaloguj się</button>
      <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:10px">Admin → nick <strong>admin</strong> + hasło admina</p>
    </div>
  </div>`;
}

function bindLogin() {
  document.getElementById("li-p")?.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
  document.getElementById("li-btn")?.addEventListener("click", doLogin);
}

async function doLogin() {
  const nick = document.getElementById("li-n").value.trim();
  const pass = document.getElementById("li-p").value;
  const errEl = document.getElementById("li-e");
  const btn = document.getElementById("li-btn");
  if (!nick) { showErr(errEl, "Podaj nick."); return; }
  btn.disabled = true; btn.innerHTML = '<span class="sp"></span> Logowanie...';
  try {
    const r = await api("login", { name: nick, pass });
    if (!r.ok) { showErr(errEl, r.error); btn.disabled=false; btn.innerHTML='<i class="ti ti-login"></i> Zaloguj się'; return; }
    S.session = r.isAdmin ? { isAdmin: true, adminPass: pass } : { isAdmin: false, userId: r.userId, userName: r.userName };
    sessionStorage.setItem("m26_sess", JSON.stringify(S.session));
    await loadData();
    render();
  } catch(e) {
    showErr(errEl, e.message);
    btn.disabled=false; btn.innerHTML='<i class="ti ti-login"></i> Zaloguj się';
  }
}

function doLogout() {
  S = { session:null, matches:[], bets:{}, leaderboard:[], users:[], tab:"bet", localAdv:{} };
  sessionStorage.removeItem("m26_sess");
  render();
}
window.doLogout = doLogout;

// ── Data ──────────────────────────────────────────────────────
async function loadData() {
  const base = S.session.isAdmin ? { isAdmin: true } : { userId: S.session.userId };
  const [mR, bR, lR] = await Promise.all([
    api("getMatches", base), api("getBetsForUser", base), api("getLeaderboard")
  ]);
  if (mR.ok) S.matches = mR.matches || [];
  if (bR.ok) S.bets = bR.bets || {};
  if (lR.ok) S.leaderboard = lR.leaderboard || [];
  if (S.session.isAdmin) {
    const uR = await api("getUsers", { adminPass: S.session.adminPass });
    if (uR.ok) S.users = uR.users || [];
  }
}

async function reload() { await loadData(); }

// ══════════════════════════════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════════════════════════════
function renderAdmin() {
  const tabs = [{id:"qf",i:"ti-tournament",l:"Ćwierćfinały"},{id:"matches",i:"ti-ball-football",l:"Mecze"},{id:"users",i:"ti-users",l:"Uczestnicy"},{id:"results",i:"ti-clipboard-check",l:"Wyniki"},{id:"leaderboard",i:"ti-trophy",l:"Tabela"}];
  return `<div class="header">
    <div class="h-left"><span style="font-size:23px">⚽</span><div><h1>Mundial 2026</h1><small>Panel admina</small></div></div>
    <div class="h-right"><span class="badge ba"><i class="ti ti-shield-check"></i> Admin</span><button class="btn bsm" onclick="doLogout()"><i class="ti ti-logout"></i> Wyloguj</button></div>
  </div>
  <div class="tabs">${tabs.map(t=>`<button class="tab${S.tab===t.id?" on":""}" onclick="setTab('${t.id}')"><i class="ti ${t.i}"></i> ${t.l}</button>`).join("")}</div>
  <div id="tc">${renderAdminTab()}</div>`;
}

function renderAdminTab() {
  if (S.tab==="qf")      return adminQF();
  if (S.tab==="matches") return adminMatches();
  if (S.tab==="users")   return adminUsers();
  if (S.tab==="results") return adminResults();
  return renderLB(true);
}

// ── Admin: Ćwierćfinały ───────────────────────────────────────
function adminQF() {
  const rows = QF_MATCHES.map(qf => {
    const m = S.matches.find(x => x.home===qf.home && x.away===qf.away && x.type==="normal");
    const added = !!m;
    const st = m ? matchStarted(m) : false;
    const dtLocal = new Date(qf.datetime).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    return `<div class="mi">
      <div class="mh">
        <span class="mt">${qf.home}<span class="mvs">vs</span>${qf.away}</span>
        <div class="mtags">
          <span class="badge bs">${qf.label}</span>
          ${added ? `<span class="badge ${st?"bst":"bo"}">${st?"Trwa/po":"Przed"}</span>` : `<span class="badge" style="background:#f1f0e8;color:#666">Nie dodany</span>`}
        </div>
      </div>
      <div class="mm"><i class="ti ti-clock" style="font-size:12px;vertical-align:-1px"></i> ${dtLocal}</div>
      ${m && m.result ? `<div class="rs">${m.result.home}:${m.result.away}${m.result.advance?" (awans: "+(m.result.advance==="home"?m.home:m.away)+")":""}</div>` : ""}
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        ${!added
          ? `<button class="btn bp bsm" onclick="aAddQF('${qf.qfId}')"><i class="ti ti-circle-plus"></i> Dodaj do typowania</button>`
          : `<button class="btn bxs bd" onclick="aDelMatch('${m.id}')"><i class="ti ti-trash"></i> Usuń</button>`
        }
      </div>
    </div>`;
  }).join("");

  // Sekcja wyników ćwierćfinałów
  const qfMatches = S.matches.filter(m => {
    return QF_MATCHES.some(qf => qf.home===m.home && qf.away===m.away);
  });
  const avail = qfMatches.filter(m => matchStarted(m) && !m.result);
  const done  = qfMatches.filter(m => m.result);

  const resHtml = !avail.length && !done.length ? "" : `
  <div class="card" style="margin-top:0">
    <h2><i class="ti ti-edit" style="color:var(--blue)"></i> Wpisz wyniki ćwierćfinałów</h2>
    ${!avail.length ? '<div class="empty" style="padding:12px 0">Brak meczów do uzupełnienia</div>' : avail.map(m=>`
      <div class="mi">
        <div class="mh"><span class="mt">${m.home}<span class="mvs">vs</span>${m.away}</span><span class="badge bst">Trwa/po</span></div>
        <div class="sr">
          <input class="si" id="rh-${m.id}" type="number" min="0" placeholder="0" oninput="chkRR('${m.id}')"/>
          <span class="ss">:</span>
          <input class="si" id="ra-${m.id}" type="number" min="0" placeholder="0" oninput="chkRR('${m.id}')"/>
        </div>
        <div id="rw-${m.id}" style="display:none" class="ar">
          <label>Kto awansuje (przy remisie)?</label>
          <select id="rv-${m.id}"><option value="">— wybierz —</option><option value="home">${m.home}</option><option value="away">${m.away}</option></select>
        </div>
        <button class="btn bp bsm" style="margin-top:9px" onclick="aSetRes('${m.id}')"><i class="ti ti-device-floppy"></i> Zapisz wynik</button>
      </div>`).join("")}
    ${done.map(m=>`
      <div class="mi">
        <div class="mt">${m.home}<span class="mvs">vs</span>${m.away}</div>
        <div class="rs">${m.result.home}:${m.result.away}${m.result.advance?" (awans: "+(m.result.advance==="home"?m.home:m.away)+")":""}</div>
        <button class="btn bxs bd" style="margin-top:7px" onclick="aClrRes('${m.id}')"><i class="ti ti-refresh"></i> Cofnij</button>
      </div>`).join("")}
  </div>`;

  return `<div class="card">
    <h2><i class="ti ti-tournament" style="color:var(--blue)"></i> Ćwierćfinały — pary</h2>
    <div class="al ai" style="margin-bottom:12px"><i class="ti ti-info-circle"></i> Kliknij „Dodaj do typowania" żeby otworzyć daną parę dla uczestników. Typy są ukryte do momentu startu meczu.</div>
    ${rows}
  </div>${resHtml}`;
}

window.aAddQF = async function(qfId) {
  const qf = QF_MATCHES.find(q => q.qfId===qfId);
  if (!qf) return;
  const r = await api("addMatch", { adminPass: S.session.adminPass, home: qf.home, away: qf.away, datetime: qf.datetime, type: "normal" });
  if (!r.ok) { alert(r.error); return; }
  await reload(); render();
};

function typeInfo(t) {
  return t==="final" ? {cls:"bf",lbl:"Finał"} : t==="third" ? {cls:"bt",lbl:"3. miejsce"} : {cls:"bs",lbl:"Półfinał/ćw."};
}

function adminMatches() {

window.chkRR = (mid) => {
  const h = document.getElementById(`rh-${mid}`)?.value;
  const a = document.getElementById(`ra-${mid}`)?.value;
  const w = document.getElementById(`rw-${mid}`);
  if (w) w.style.display = (h!==""&&a!==""&&parseInt(h)===parseInt(a)) ? "" : "none";
};
window.aDelMatch = async (id) => { if(!confirm("Usunąć mecz?"))return; await api("deleteMatch",{adminPass:S.session.adminPass,matchId:id}); await reload(); render(); };
window.aDelUser  = async (id) => { if(!confirm("Usunąć uczestnika?"))return; await api("deleteUser",{adminPass:S.session.adminPass,userId:id}); await reload(); render(); };
window.aSetRes   = async (mid) => {
  const rh=document.getElementById(`rh-${mid}`)?.value, ra=document.getElementById(`ra-${mid}`)?.value;
  if(rh===""||ra===""){alert("Podaj wynik.");return;}
  const ih=parseInt(rh), ia=parseInt(ra);
  let adv = "";
  if(ih===ia){adv=document.getElementById(`rv-${mid}`)?.value||"";if(!adv){alert("Podaj kto awansuje.");return;}}
  const r=await api("setResult",{adminPass:S.session.adminPass,matchId:mid,resultHome:ih,resultAway:ia,resultAdvance:adv});
  if(!r.ok){alert(r.error);return;}
  await reload(); render();
};
window.aClrRes = async (mid) => { if(!confirm("Cofnąć wynik?"))return; await api("clearResult",{adminPass:S.session.adminPass,matchId:mid}); await reload(); render(); };

function bindAdmin() {
  document.getElementById("m-add")?.addEventListener("click", async () => {
    const h=document.getElementById("m-h").value.trim(), a=document.getElementById("m-a").value.trim();
    const d=document.getElementById("m-d").value, t=document.getElementById("m-t").value;
    const e=document.getElementById("m-e");
    if(!h||!a||!d){showErr(e,"Wypełnij wszystkie pola.");return;}
    const btn=document.getElementById("m-add"); btn.disabled=true;
    const r=await api("addMatch",{adminPass:S.session.adminPass,home:h,away:a,datetime:d,type:t});
    btn.disabled=false;
    if(!r.ok){showErr(e,r.error);return;}
    await reload(); render();
  });
  document.getElementById("u-add")?.addEventListener("click", async () => {
    const n=document.getElementById("u-n").value.trim(), p=document.getElementById("u-p").value;
    const e=document.getElementById("u-e");
    if(!n||!p){showErr(e,"Podaj nick i hasło.");return;}
    const btn=document.getElementById("u-add"); btn.disabled=true;
    const r=await api("addUser",{adminPass:S.session.adminPass,name:n,pass:p});
    btn.disabled=false;
    if(!r.ok){showErr(e,r.error);return;}
    await reload(); render();
  });
}

function userQF() {
  const uid = S.session.userId;
  const opened = QF_MATCHES.filter(qf => S.matches.some(m => m.home===qf.home && m.away===qf.away));
  const notYet  = QF_MATCHES.filter(qf => !S.matches.some(m => m.home===qf.home && m.away===qf.away));

  if (!opened.length) {
    return `<div class="card">
      <h2><i class="ti ti-tournament" style="color:var(--blue)"></i> Ćwierćfinały</h2>

      </div>`).join("")}
    </div>`;
  }

  const html = QF_MATCHES.map(qf => {
    const m = S.matches.find(x => x.home===qf.home && x.away===qf.away);
    const dtStr = new Date(qf.datetime).toLocaleString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
    if (!m) {
      return `<div class="mi" style="opacity:.5">
        <div class="mh"><span class="mt">${qf.home}<span class="mvs">vs</span>${qf.away}</span>
          <div class="mtags"><span class="badge bs">${qf.label}</span><span class="badge bst">Niedostępny</span></div></div>
        <div class="mm">${dtStr}</div>
        <div class="ln"><i class="ti ti-lock" style="font-size:12px"></i> Admin jeszcze nie otworzył tej pary</div>
      </div>`;
    }
    const st = matchStarted(m);
    const mb = S.bets[m.id] || {};
    const my = mb[uid];
    const ladv = S.localAdv[m.id] || my?.advance || "";
    const bh = my ? my.home : "", ba = my ? my.away : "";
    const showAdv = bh!==""&&ba!==""&&parseInt(bh)===parseInt(ba);

    let body = "";
    if (!st) {
      body = `<div class="sr">
        <input class="si" id="bh-${m.id}" type="number" min="0" value="${bh}" placeholder="0" oninput="onSC('${m.id}')"/>
        <span class="ss">:</span>
        <input class="si" id="ba-${m.id}" type="number" min="0" value="${ba}" placeholder="0" oninput="onSC('${m.id}')"/>
        <button class="btn bp bsm" onclick="saveBet('${m.id}')"><i class="ti ti-device-floppy"></i> Zapisz</button>
      </div>
      <div id="adv-${m.id}" class="ar" style="${showAdv?"":"display:none"}">
        <label>Kto awansuje (przy remisie)?</label>
        <div class="chips">
          <span class="chip${ladv==="home"?" on":""}" data-adv="home" onclick="selAdv('${m.id}','home')">${m.home}</span>
          <span class="chip${ladv==="away"?" on":""}" data-adv="away" onclick="selAdv('${m.id}','away')">${m.away}</span>
        </div>
      </div>
      ${my?`<div class="ln"><i class="ti ti-lock" style="font-size:12px"></i>Typ zapisany — ukryty do startu meczu</div>`:""}`;
    } else {
      if (my) {
        const advS = my.advance ? ` (awans: ${my.advance==="home"?m.home:m.away})` : "";
        body = `<div class="bb">Twój typ: <strong>${my.home}:${my.away}${advS}</strong></div>`;
        if (m.result) {
          const pts = calcPts(my, m);
          const advR = m.result.advance ? ` (awans: ${m.result.advance==="home"?m.home:m.away})` : "";
          body += `<div class="rs">${m.result.home}:${m.result.away}${advR}</div>
            <div class="pl">→ <strong style="color:var(--blue)">${pts} pkt</strong></div>`;
        } else {
          body += `<div class="ln"><i class="ti ti-clock" style="font-size:12px"></i>Mecz trwa — czekamy na wynik</div>`;
        }
      } else {
        body = `<div class="al aw"><i class="ti ti-alert-triangle"></i> Mecz rozpoczęty — nie można dodać typu.</div>`;
      }
    }

    // Typy innych po starcie
    let othersHtml = "";
    if (st) {
      const others = Object.entries(mb).filter(([id]) => id !== uid);
      if (others.length) {
        const rows = others.map(([oid, b]) => {
          const uName = S.leaderboard.find(u=>u.id===oid)?.name || "?";
          const advS = b.advance ? ` (${b.advance==="home"?m.home:m.away})` : "";
          const pts = m.result ? calcPts(b, m) : null;
          return `<tr><td>${uName}</td><td><strong>${b.home}:${b.away}</strong>${advS}</td>
            <td>${pts!==null?`<span class="bpts">${pts}p</span>`:""}</td></tr>`;
        }).join("");
        othersHtml = `<div class="sep"></div><div class="ol"><i class="ti ti-users" style="font-size:12px;vertical-align:-1px"></i> Typy innych</div>
          <table class="ot"><thead><tr><th>Nick</th><th>Typ</th><th>Pkt</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
    }

    return `<div class="mi">
      <div class="mh">
        <span class="mt">${m.home}<span class="mvs">vs</span>${m.away}</span>
        <div class="mtags"><span class="badge bs">${qf.label}</span><span class="badge ${st?"bst":"bo"}">${st?"Trwa/po":"Przed"}</span></div>
      </div>
      <div class="mm">${dtStr}</div>
      ${body}${othersHtml}
    </div>`;
  }).join("");

  return `<div class="card">
    <h2><i class="ti ti-tournament" style="color:var(--blue)"></i> Ćwierćfinały</h2>
    ${html}
  </div>`;
}

window.onSC = function(mid) {
  const h = document.getElementById(`bh-${mid}`)?.value;
  const a = document.getElementById(`ba-${mid}`)?.value;
  const adv = document.getElementById(`adv-${mid}`);
  if (adv) adv.style.display = (h!==""&&a!==""&&parseInt(h)===parseInt(a)) ? "" : "none";
};
window.selAdv = function(mid, val) {
  S.localAdv[mid] = val;
  document.querySelectorAll(`#adv-${mid} .chip`).forEach(c => c.classList.toggle("on", c.dataset.adv===val));
};
window.saveBet = async function(mid) {
  const m = S.matches.find(x=>x.id===mid);
  if (!m||matchStarted(m)){alert("Mecz już się rozpoczął.");return;}
  const h=parseInt(document.getElementById(`bh-${mid}`)?.value);
  const a=parseInt(document.getElementById(`ba-${mid}`)?.value);
  if(isNaN(h)||isNaN(a)||h<0||a<0){alert("Podaj prawidłowe liczby.");return;}
  let adv="";
  if(h===a){adv=S.localAdv[mid]||"";if(!adv){alert("Przy remisie wskaż kto awansuje.");return;}}
  const r=await api("saveBet",{userId:S.session.userId,matchId:mid,home:h,away:a,advance:adv});
  if(!r.ok){alert(r.error);return;}
  await reload(); render();
};

  const rules = [
    {i:"ti-sort-ascending-numbers",t:"Kolejność typowania",x:"Lider musi wrzucić typy najpóźniej 24h przed pierwszym meczem. Jeśli się spóźni, nie może skopiować dokładnych wyników od wicelidera."},
    {i:"ti-ball-football",t:"Wynik po 90 minutach",x:"Typujemy wynik po regulaminowym czasie gry. Dogrywka i rzuty karne nie liczą się. Przy remisie wskaż kto awansuje."},
    {i:"ti-star",t:"Punktacja — Ćwierćfinał / Półfinał",x:"3 pkt – dokładny wynik. 1 pkt – trafienie zwycięzcy lub remisu."},
    {i:"ti-trophy",t:"Finał i mecz o 3. miejsce",x:"5 pkt – dokładny wynik. 2 pkt – trafienie zwycięzcy lub remisu. Maks. 6 pkt z bonusem."},
    {i:"ti-plus",t:"Bonus za remis +1 pkt",x:"Dokładny remis + trafiony awans = 4 pkt. Inny remis + trafiony awans = 2 pkt. Błędny awans → bonus przepada."},
    {i:"ti-scale",t:"Remis w tabeli",x:"Przy równej liczbie punktów wygrywa gracz z większą liczbą dokładnych wyników w turnieju."},
  ];
  return `<div class="card"><h2><i class="ti ti-book" style="color:var(--blue)"></i> Regulamin</h2>
    ${rules.map(r=>`<div class="ri"><div class="ric"><i class="ti ${r.i}"></i></div>
      <div><div class="rit">${r.t}</div><div class="rix">${r.x}</div></div></div>`).join("")}
  </div>`;
}

// ── Navigation ────────────────────────────────────────────────
window.setTab = async function(tab) {
  S.tab = tab; await reload(); render();
};

// ── Init ──────────────────────────────────────────────────────
(async () => {
  const saved = sessionStorage.getItem("m26_sess");
  if (saved) {
    try { S.session = JSON.parse(saved); await loadData(); } catch(e) { S.session = null; }
  }
  render();
})();
</script>
</body>
